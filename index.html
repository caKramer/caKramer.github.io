<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK - Portfolio</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-heading: #ffffff;
            --accent-color: #58a6ff;
            --tag-bg: #1f242d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--text-heading);
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 500;
        }

        section {
            margin-bottom: 2rem;
        }

        h2 {
            color: var(--text-heading);
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
            margin-bottom: 1rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            list-style: none;
            padding: 0;
        }

        .skill-tag {
            background-color: var(--tag-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .links a {
            color: var(--accent-color);
            text-decoration: none;
            margin-right: 1.5rem;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CK</h1>
            <div class="subtitle">Software Engineer | Data Scientist | Program Manager</div>
        </header>

        <section>
            <h2>Skills</h2>
            <ul class="skills-list">
                <li class="skill-tag">Java</li>
                <li class="skill-tag">Angular</li>
                <li class="skill-tag">Ontologies</li>
                <li class="skill-tag">Architecture Design</li>
                <li class="skill-tag">Cloud Deployments</li>
                <li class="skill-tag">Program Management</li>
            </ul>
        </section>

        <section>
            <h2>Connect</h2>
            <div class="links">
                <a href="https://github.com/YOUR_USERNAME" target="_blank">GitHub Profile</a>
                <a href="https://linkedin.com/in/YOUR_USERNAME" target="_blank">LinkedIn</a>
                <a href="mailto:your.email@example.com">Email</a>
            </div>
        </section>
    </div>

</body>
</html>
